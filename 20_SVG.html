<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svgt</title>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">

  <!-- Sky -->
  <rect width="900" height="700" fill="#87CEEB"/>

  <!-- Sun -->
  <circle cx="120" cy="100" r="50" fill="#FFD54F"/>

  <!-- Ground -->
  <rect x="0" y="600" width="900" height="100" fill="#7CB342"/>

  <!-- Road -->
  <rect x="0" y="520" width="900" height="80" fill="#555"/>
  <line x1="0" y1="560" x2="900" y2="560"
        stroke="white" stroke-width="6"
        stroke-dasharray="25 20"/>

  <!-- Main Building -->
  <rect x="250" y="100" width="400" height="420"
        fill="#D7CCC8"
        stroke="#555"
        stroke-width="3"/>

  <!-- Rooftop -->
  <rect x="230" y="80" width="440" height="20"
        fill="#8D6E63"/>

  <!-- Water Tanks -->
  <rect x="300" y="30" width="70" height="50"
        fill="#333"/>
  <ellipse cx="335" cy="30" rx="35" ry="10"
           fill="#444"/>

  <rect x="530" y="30" width="70" height="50"
        fill="#333"/>
  <ellipse cx="565" cy="30" rx="35" ry="10"
           fill="#444"/>

  <!-- Balconies and Windows -->
  <g>
    <!-- Floors -->
    <g fill="#B3E5FC" stroke="#555">
      <!-- Row 1 -->
      <rect x="290" y="130" width="60" height="60"/>
      <rect x="420" y="130" width="60" height="60"/>
      <rect x="550" y="130" width="60" height="60"/>

      <!-- Row 2 -->
      <rect x="290" y="220" width="60" height="60"/>
      <rect x="420" y="220" width="60" height="60"/>
      <rect x="550" y="220" width="60" height="60"/>

      <!-- Row 3 -->
      <rect x="290" y="310" width="60" height="60"/>
      <rect x="420" y="310" width="60" height="60"/>
      <rect x="550" y="310" width="60" height="60"/>

      <!-- Row 4 -->
      <rect x="290" y="400" width="60" height="60"/>
      <rect x="420" y="400" width="60" height="60"/>
      <rect x="550" y="400" width="60" height="60"/>
    </g>

    <!-- Balcony Railings -->
    <g stroke="#444" stroke-width="2">
      <rect x="275" y="195" width="90" height="10" fill="none"/>
      <rect x="405" y="195" width="90" height="10" fill="none"/>
      <rect x="535" y="195" width="90" height="10" fill="none"/>

      <rect x="275" y="285" width="90" height="10" fill="none"/>
      <rect x="405" y="285" width="90" height="10" fill="none"/>
      <rect x="535" y="285" width="90" height="10" fill="none"/>

      <rect x="275" y="375" width="90" height="10" fill="none"/>
      <rect x="405" y="375" width="90" height="10" fill="none"/>
      <rect x="535" y="375" width="90" height="10" fill="none"/>
    </g>
  </g>

  <!-- Entrance -->
  <rect x="420" y="450" width="60" height="70"
        fill="#6D4C41"/>

  <!-- Steps -->
  <rect x="405" y="520" width="90" height="10"
        fill="#999"/>
  <rect x="395" y="530" width="110" height="10"
        fill="#AAA"/>

  <!-- Trees -->
  <g>
    <rect x="150" y="500" width="15" height="60"
          fill="#795548"/>
    <circle cx="158" cy="470" r="35"
            fill="#43A047"/>

    <rect x="730" y="500" width="15" height="60"
          fill="#795548"/>
    <circle cx="738" cy="470" r="35"
            fill="#43A047"/>
  </g>

  <!-- Car -->
  <g transform="translate(120,545)">
    <rect x="0" y="0" width="120" height="35"
          rx="10"
          fill="#E53935"/>
    <rect x="20" y="-20" width="60" height="25"
          rx="5"
          fill="#E57373"/>
    <circle cx="25" cy="40" r="12" fill="#222"/>
    <circle cx="95" cy="40" r="12" fill="#222"/>
  </g>

  <!-- Title -->
  <text x="450" y="660"
        text-anchor="middle"
        font-size="28"
        font-family="Arial"
        font-weight="bold"
        fill="#263238">
    Mumbai Residential Apartment Building
  </text>

</svg>
</body>
</html>
